spring.application.name=atlas

# The Python side's .env (gitignored) supplies DB_NAME, DB_USER, DB_PASSWORD,
# DB_HOST and DB_PORT, so both services use one PostgreSQL. Any ATLAS_* or
# DB_* variable set in the real environment wins over the file.
spring.config.import=optional:file:${ATLAS_ENV_FILE:../app/.env}[.properties]

server.port=${ATLAS_HTTP_PORT:8080}
# A query can run for many minutes on a CPU; the response must not be cut short.
server.tomcat.connection-timeout=30s
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.problemdetails.enabled=false
spring.docker.compose.enabled=false

# --- PostgreSQL ----------------------------------------------------------------
spring.datasource.url=${ATLAS_DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:Vectors}}
spring.datasource.username=${ATLAS_DB_USER:${DB_USER:postgres}}
spring.datasource.password=${ATLAS_DB_PASSWORD:${DB_PASSWORD:}}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000

# Flyway owns only user_table. The database already holds the Python side's
# tables, so the first run baselines instead of refusing; clean never runs.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=true
spring.flyway.table=atlas_flyway_history

# --- JWT -----------------------------------------------------------------------
# Required: base64 of at least 32 random bytes, e.g. `openssl rand -base64 48`.
atlas.jwt.secret=${ATLAS_JWT_SECRET:}
atlas.jwt.issuer=${ATLAS_JWT_ISSUER:atlas}
atlas.jwt.audience=${ATLAS_JWT_AUDIENCE:atlas-api}
atlas.jwt.expiration=${ATLAS_JWT_EXPIRATION:PT1H}

# --- Argon2id -------------------------------------------------------------------
# 64 MiB, 3 passes, 1 lane: ~100 ms a hash on the development machine (measured;
# the OWASP floor of 19 MiB / 2 passes took 21 ms). At most max-concurrent hashes
# run at once, so a burst of logins costs at most 4 x 64 MiB.
atlas.argon2.memory-kib=${ATLAS_ARGON2_MEMORY_KIB:65536}
atlas.argon2.iterations=${ATLAS_ARGON2_ITERATIONS:3}
atlas.argon2.parallelism=${ATLAS_ARGON2_PARALLELISM:1}
atlas.argon2.max-concurrent=${ATLAS_ARGON2_MAX_CONCURRENT:4}
atlas.argon2.salt-length=16
atlas.argon2.hash-length=32

# --- Abuse protection ----------------------------------------------------------
atlas.rate-limit.login-per-ip.capacity=20
atlas.rate-limit.login-per-ip.period=PT1M
atlas.rate-limit.login-per-email.capacity=10
atlas.rate-limit.login-per-email.period=PT15M
atlas.rate-limit.register-per-ip.capacity=10
atlas.rate-limit.register-per-ip.period=PT1H

# --- Browser clients -----------------------------------------------------------
atlas.cors.allowed-origins=${ATLAS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- Python pipeline over gRPC -------------------------------------------------
atlas.grpc.host=${ATLAS_GRPC_HOST:127.0.0.1}
atlas.grpc.port=${ATLAS_GRPC_PORT:50051}
# Required: the same value the Python server is started with.
atlas.grpc.service-token=${ATLAS_GRPC_SERVICE_TOKEN:}
atlas.grpc.query-deadline=${ATLAS_GRPC_QUERY_DEADLINE:PT20M}
atlas.grpc.ingest-deadline=${ATLAS_GRPC_INGEST_DEADLINE:PT30M}
atlas.grpc.list-deadline=${ATLAS_GRPC_LIST_DEADLINE:PT10S}
atlas.grpc.tls.enabled=${ATLAS_GRPC_TLS_ENABLED:false}
atlas.grpc.tls.trust-cert-collection=${ATLAS_GRPC_TLS_TRUST_CERT:}
atlas.grpc.tls.client-cert-chain=${ATLAS_GRPC_TLS_CLIENT_CERT:}
atlas.grpc.tls.client-private-key=${ATLAS_GRPC_TLS_CLIENT_KEY:}

# --- Uploads -------------------------------------------------------------------
atlas.upload.max-files=10
atlas.upload.max-file-size=25MB
atlas.upload.max-request-size=100MB
# Spring parses the multipart body first; these must agree with atlas.upload.*.
# Parts over 1 MB go to a temporary file, not the heap.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=1MB
server.tomcat.max-swallow-size=2MB

atlas.query.max-chars=8000

# --- Health and logging --------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.pattern.correlation=[%X{requestId:-}]
