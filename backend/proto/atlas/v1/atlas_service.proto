// The contract between the Java API (client) and the Python pipeline (server).
//
// Java generates its bindings from this file at build time (atlas/pom.xml);
// Python's are generated by app/scripts/generate_grpc.py and checked by a test
// that regenerates them. Edit this file, never the generated code.
//
// Every call carries `authorization: Bearer <service token>` metadata: the
// Python server trusts the user_id fields only because the caller proved it is
// the Java service, which takes user_id from a verified JWT.
//
// Failures are gRPC status codes, with the trailer `atlas-error-code` naming
// the reason (CONVERSATION_NOT_FOUND, INVALID_REQUEST, BUSY, MODEL_UNAVAILABLE,
// DATABASE_UNAVAILABLE, INTERNAL, ...). A completed request is always OK.

syntax = "proto3";

package atlas.v1;

option java_multiple_files = true;
option java_package = "com.fyp.atlas.grpc.v1";
option java_outer_classname = "AtlasServiceProto";

service AtlasService {
  // One query through the whole pipeline. Starts a conversation when
  // conversation_id is absent; otherwise the user must own it.
  rpc Query(QueryRequest) returns (QueryResponse);

  // One or more files, streamed: an IngestHeader, then for each file a
  // FileStart, its FileChunks and a FileEnd.
  rpc Ingest(stream IngestRequest) returns (IngestResponse);

  // Liveness and whether the pipeline is loaded; no model call.
  rpc Health(HealthRequest) returns (HealthResponse);

  // The user's conversations, most recently active first. Read-only: served
  // beside a running query, never queued behind it.
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);

  // One conversation's exchanges, oldest first. The user must own it;
  // another user's conversation is NOT_FOUND, as if absent. Read-only.
  rpc ListExchanges(ListExchangesRequest) returns (ListExchangesResponse);
}

// ---------------------------------------------------------------------------
// Query

message QueryRequest {
  string request_id = 1;              // correlation id, chosen by Java
  string user_id = 2;                 // the JWT subject, never a client field
  optional string conversation_id = 3;
  string query = 4;
  map<string, string> metadata = 5;   // e.g. client, for logs only
}

enum QueryStatus {
  QUERY_STATUS_UNSPECIFIED = 0;
  QUERY_STATUS_COMPLETED = 1;
  QUERY_STATUS_COMPLETED_WITH_WARNINGS = 2;
}

message QueryResponse {
  string request_id = 1;
  string conversation_id = 2;
  string conversation_name = 3;
  bool new_conversation = 4;
  string answer = 5;
  QueryStatus status = 6;
  int64 execution_time_ms = 7;
  int32 retry_count = 8;              // job retries + plan revisions + runtime retries
  repeated string warnings = 9;
  bool persisted = 10;                // memory and exchange log both written
  map<string, int64> stage_ms = 11;   // decomposition, memory, retrieval, ...
  string mode = 12;                   // decomposition mode
  string thinking_path = 13;          // direct, planned, expanded
}

// ---------------------------------------------------------------------------
// Ingest

message IngestRequest {
  oneof part {
    IngestHeader header = 1;
    FileStart file_start = 2;
    FileChunk chunk = 3;
    FileEnd file_end = 4;
  }
}

message IngestHeader {
  string request_id = 1;
  string user_id = 2;                 // the owner of every file in this request
  int32 file_count = 3;               // files that will follow
}

message FileStart {
  int32 file_index = 1;               // 0, 1, 2 ... in order
  string filename = 2;                // original name, for reporting only
  string content_type = 3;            // as declared by the client; not trusted
  int64 size_bytes = 4;
}

message FileChunk {
  int32 file_index = 1;
  bytes data = 2;
}

message FileEnd {
  int32 file_index = 1;
  string sha256 = 2;                  // hex, over every chunk's data
}

enum IngestStatus {
  INGEST_STATUS_UNSPECIFIED = 0;
  INGEST_STATUS_COMPLETED = 1;        // every file ingested
  INGEST_STATUS_PARTIAL = 2;          // some ingested, some not
  INGEST_STATUS_FAILED = 3;           // none ingested
}

enum FileStatus {
  FILE_STATUS_UNSPECIFIED = 0;
  FILE_STATUS_INGESTED = 1;
  FILE_STATUS_REJECTED = 2;           // failed validation; never reached the pipeline
  FILE_STATUS_FAILED = 3;             // the pipeline could not ingest it
  FILE_STATUS_NOT_INGESTED = 4;       // a limit stopped the run before this file
}

message FileResult {
  int32 file_index = 1;
  string filename = 2;
  FileStatus status = 3;
  string document_id = 4;
  int32 chunks = 5;
  int32 vectors = 6;
  int64 stored_bytes = 7;             // measured corpus growth
  string error_code = 8;              // UNSUPPORTED_TYPE, MALFORMED, EMPTY, TOO_LARGE,
                                      // NO_TEXT, CHECKSUM_MISMATCH, QUOTA_EXCEEDED,
                                      // DISK_FULL, VECTOR_STORE_UNAVAILABLE, INTERNAL
  string error_message = 9;           // safe for the end user
}

message IngestResponse {
  string request_id = 1;
  IngestStatus status = 2;
  repeated FileResult files = 3;
  int32 succeeded = 4;
  int32 failed = 5;
  int64 storage_used_bytes = 6;
  optional int64 storage_limit_bytes = 7;   // absent when the quota is unlimited
  string stopped_reason = 8;
  int64 execution_time_ms = 9;
}

// ---------------------------------------------------------------------------
// Health

message HealthRequest {}

message HealthResponse {
  bool serving = 1;
  bool pipeline_ready = 2;
  int32 queued = 3;                   // operations waiting for the pipeline
  bool busy = 4;                      // an operation is running
}

// ---------------------------------------------------------------------------
// Conversations
//
// Both listings page by keyset: `limit` (0 = 50, at most 200) and `cursor`,
// the `next_cursor` of the previous page, opaque to the caller and empty for
// the first page. An empty `next_cursor` means there is nothing more. A cursor
// that cannot be read is INVALID_ARGUMENT with atlas-error-code INVALID_CURSOR.
// Timestamps are RFC 3339 strings in UTC with microseconds.

message ListConversationsRequest {
  string request_id = 1;
  string user_id = 2;
  int32 limit = 3;
  string cursor = 4;
}

message ConversationSummary {
  string conversation_id = 1;
  string conversation_name = 2;
  string created_at = 3;
  string last_activity_at = 4;        // latest of start, last query, last answer
  int32 exchange_count = 5;           // queries recorded, answered or not
}

message ListConversationsResponse {
  string request_id = 1;
  repeated ConversationSummary conversations = 2;
  string next_cursor = 3;
}

message ListExchangesRequest {
  string request_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  int32 limit = 4;
  string cursor = 5;
}

message ExchangeRecord {
  string exchange_id = 1;
  string query = 2;
  string asked_at = 3;
  optional string answer = 4;         // absent when no answer was recorded
  optional string answered_at = 5;
}

message ListExchangesResponse {
  string request_id = 1;
  string conversation_id = 2;
  string conversation_name = 3;
  repeated ExchangeRecord exchanges = 4;
  string next_cursor = 5;
}
